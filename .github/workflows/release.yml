name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches modVersion
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^modVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '[:space:]')"
          echo "Tag: $GITHUB_REF_NAME -> $tag; modVersion: $version"
          if [ -z "$version" ] || [ "$tag" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match modVersion '$version' in gradle.properties."
            exit 1
          fi

      - name: Verify compileOnly libraries
        shell: bash
        run: |
          set -euo pipefail
          for f in libs/gtnhlib-0.11.54.jar libs/mixin-forge.jar libs/simpleskinbackport-1.0.5-GTNH.jar; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f. Commit the compileOnly jars under libs/ so CI can build."
              exit 1
            fi
          done

      - name: Build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Locate release jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/GTNHFixes-*.jar)
          release=()
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-dev.jar|*-sources.jar) ;;
              *) release+=("$jar") ;;
            esac
          done
          if [ "${#release[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release jar, found: ${release[*]:-none}"
            exit 1
          fi
          echo "jar=${release[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GTNH Fixes ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.jar.outputs.jar }}
          prerelease: ${{ contains(github.ref_name, '-') }}
